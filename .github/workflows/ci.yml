name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check documentation, integrity, privacy and app logic
        run: npm test
      - name: Check unsigned runtime packaging
        run: python3 tools/package_unsigned.py
      - name: Install pinned browser-test dependencies
        run: npm ci --ignore-scripts
      - name: Run isolated browser fixtures
        run: npm run test:browser
      - name: Ensure checks leave tracked source unchanged
        run: git diff --exit-code
