name: Feature request
description: Suggest a focused improvement grounded in a real use case.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: Use English and leave out personal device, network, account, and viewing data.
  - type: textarea
    id: need
    attributes:
      label: Problem or use case
      description: Who needs this and what is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful change and any alternatives you considered.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Compatibility and evidence
      description: Link relevant primary documentation or existing project findings. Distinguish a request from a result already verified on a TV.
